# cargo-deny configuration. Checked in CI so a dependency cannot quietly introduce an
# advisory, an incompatible licence, or a second copy of something already vendored.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything in the tree must be one of these. scanr itself is MIT OR Apache-2.0.
# Exactly what the current tree uses, with nothing speculative: an unmatched allowance
# is an invitation to accept a licence nobody reviewed. Adding one should be a decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # memchr is dual MIT/Unlicense; both are acceptable.
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Denied, not warned: the header above claims a second copy cannot arrive quietly, and a
# warning does not stop anything — a duplicate had in fact already arrived under it.
# Every duplicate is now either blocked or listed below with a reason, so the claim is
# true and the exceptions are visible.
multiple-versions = "deny"
skip = [
    # toml 0.9 pulls winnow 0.7 while its own toml_parser 1.1 pulls winnow 1.0. Both are
    # dev-dependency-only (the `toml` crate is used by tests and the config fixtures), and
    # resolving it is upstream's to do. Revisit when toml unifies on winnow 1.
    { crate = "winnow@0.7.15", reason = "toml 0.9 vs toml_parser 1.1; dev-only, upstream's to unify" },
]
wildcards = "deny"
# The dependency list is short and deliberate (see docs/design/architecture.md).
# Anything arriving here that pulls in an async runtime contradicts D1 and should be a
# conscious decision rather than a transitive surprise.
deny = [
    { name = "tokio", reason = "D1: scanr uses blocking sockets on a bounded thread pool" },
    { name = "async-std", reason = "D1: no async runtime" },
    { name = "mio", reason = "D2: rejected in the runtime evaluation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
