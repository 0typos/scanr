# Partly verified. The `build` matrix has run green via `workflow_dispatch`, so
# compiling, the dirty-tree check, packaging and artifact upload are all proven.
#
# Two things a dry run cannot reach, both gated on the ref being a tag: the `publish`
# job, and the tag-versus-`--version` comparison inside the build job. Neither has
# ever executed. Expect to iterate on them during the first real `v*` tag.
#
# The matrix cross-compiles nine targets with cargo-zigbuild (scanr is pure Rust with no
# C deps, so one toolchain covers them all). `scripts/build-all.sh` is the same build
# locally; it has produced all nine archives, so compilation and packaging are proven,
# but the workflow's tooling install and cross legs are new — iterate on the first tag.
#
# Distribution is prebuilt static binaries attached to a GitHub release; the crate is
# marked `publish = false` and is not pushed to crates.io.
name: Release

on:
  push:
    tags: ["v*"]
  # Allows a dry run against a branch before trusting a real tag.
  workflow_dispatch:

# Read-only by default. Only `publish` needs to write, and it is the one job that
# creates a release; the `build` matrix compiles and uploads artifacts, which needs
# nothing beyond read. Granting write at the workflow level handed it to every job,
# including the matrix that runs `cargo build` over the tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pure-Rust, no C deps, so cargo-zigbuild cross-compiles every one of these from
        # the x86_64 runner — static musl for drop-anywhere use, glibc where musl has no
        # Rust std (s390x). Locally: `scripts/build-all.sh`.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl
          - riscv64gc-unknown-linux-musl
          - powerpc64le-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # build.rs stamps the commit into every scan record, so the tag must resolve to
        # real history rather than a shallow clone.
        with: { fetch-depth: 0 }

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross tooling (zig + cargo-zigbuild)
        run: |
          pip install --user ziglang==0.13.0
          cargo install cargo-zigbuild --locked

      - name: Refuse a dirty tree
        # build.rs stamps `-dirty` into --version from git; check git directly so this
        # holds for every target, including the cross ones we cannot execute here.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::built from a dirty working tree"; exit 1
          fi

      - name: Completions (native, identical for every target)
        run: |
          cargo build --release --locked
          mkdir -p completions
          for sh in bash zsh fish elvish power-shell; do
            target/release/scanr completion "$sh" > "completions/$sh"
          done

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Verify the version matches the tag
        # The version is compiled from the same source for every target, so checking it
        # on the natively-runnable x86_64 builds is enough to catch a tag/version drift.
        if: startsWith(matrix.target, 'x86_64') && github.ref_type == 'tag'
        run: |
          BIN=target/${{ matrix.target }}/release/scanr
          got="$("$BIN" --version | head -1 | awk '{print $2}')"
          want="${GITHUB_REF_NAME#v}"
          if [ "$want" != "$got" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match binary version $got"; exit 1
          fi

      - name: Package
        run: |
          name="scanr-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name/completions"
          cp target/${{ matrix.target }}/release/scanr "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp completions/* "dist/$name/completions/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Attach to the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job that writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section for $version"
            echo "See CHANGELOG.md." > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: notes.md
          fail_on_unmatched_files: true
