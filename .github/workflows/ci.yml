name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures. An unused-variable warning slipped into two commits during
  # development and was only caught by reading build output by hand.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs records the commit into the scan record, so it needs real history
          # rather than a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }}

      - name: Tests
        # Tests bind loopback sockets and spawn in-process SOCKS5 fixtures; no external
        # service is required.
        run: cargo test --target ${{ matrix.target }}

      - name: Static binary is actually static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/scanr
          cargo build --release --target ${{ matrix.target }}
          file "$BIN"
          # The whole point of the musl build is needing nothing at runtime.
          #
          # Tested via NEEDED entries rather than ldd output. ldd prints "statically
          # linked" for a static-pie binary and "not a dynamic executable" for a
          # classic static one, so matching on its text is fragile — an earlier version
          # did exactly that and failed a build that was correctly static.
          needed=$(readelf -d "$BIN" | grep -c NEEDED || true)
          if [ "$needed" -ne 0 ]; then
            readelf -d "$BIN" | grep NEEDED
            echo "::error::musl build links $needed shared librar(ies); it is not static"
            exit 1
          fi
          echo "static: no NEEDED entries"

  macos:
    name: macOS (build and test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { key: macos }

      # macOS is not a supported platform (D3) — Linux is. This job exists so that
      # "it also builds on a Mac" is a tested claim rather than a hopeful one, and so a
      # Linux-only assumption creeping into the code is noticed here rather than by
      # somebody's laptop. Diagnostics that read /proc degrade to "unknown" there.
      - run: cargo clippy --all-targets
      - name: Tests
        # macOS defaults RLIMIT_NOFILE to 256, well under the default concurrency, and
        # the fixtures need descriptors of their own.
        run: |
          ulimit -n 4096
          cargo test

  differential:
    name: Agreement with nmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: differential }
      - run: sudo apt-get update && sudo apt-get install -y nmap

      # These are `#[ignore]`d so a machine without nmap still gets a clean `cargo test`,
      # which meant nothing ran them and they rotted unnoticed: making spans the default
      # broke all three, and it took someone asking to find out. An ignored test that
      # nothing runs is decoration.
      #
      # `--test-threads=1` because each test binds its own fixture ports and shells out
      # to nmap; running them concurrently makes the port bookkeeping racy.
      - name: Differential against nmap
        run: cargo test --test differential -- --ignored --test-threads=1

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with: { key: coverage }
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure
        # The whole suite, with nothing excluded. The two tests that constrain a child
        # with setrlimit send that child's profile to /dev/null, because those limits
        # would otherwise truncate the .profraw and make llvm-profdata refuse the entire
        # merge. Excluding the tests by name worked too and silently stopped matching the
        # moment one was renamed.
        run: |
          set -euo pipefail
          cargo llvm-cov --summary-only --json --output-path coverage.json \
            --ignore-filename-regex 'testsupport'

      - name: Enforce the floor
        # A floor, not a target. It exists so the failure paths that carried three
        # integrity defects cannot quietly go uncovered again; raise it when the real
        # figure has moved comfortably clear.
        #
        # Note the figure counts inline `#[cfg(test)]` modules, which are themselves
        # fully covered, so it flatters production coverage by a few points. That is
        # fine for a floor — it is measured the same way every run, so a regression
        # still shows — but do not read it as the coverage of shipped code.
        run: |
          set -euo pipefail
          FLOOR=85
          pct=$(jq -r '.data[0].totals.regions.percent' coverage.json)
          printf 'region coverage: %.2f%% (floor %s%%)\n' "$pct" "$FLOOR"
          # An `if` rather than `awk ... && { ... }`: under `set -e` the latter fails the
          # step when awk exits non-zero, which is exactly the passing case.
          if awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p < f) }'; then
            echo "::error::region coverage $pct% is below the $FLOOR% floor"
            exit 1
          fi
          echo "above the floor"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Must match rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with: { key: msrv }
      - run: cargo check --all-targets

  install:
    name: cargo install works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: install }
      # The documented install path. Verified because it was once broken and nobody knew.
      - run: cargo install --path . --root "$RUNNER_TEMP/inst" --locked
      - run: "$RUNNER_TEMP/inst/bin/scanr --version"

  audit:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Replay the fuzz corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { key: fuzz }
      - run: cargo install cargo-fuzz --locked
      # Replay the committed seeds only. This is a regression check, not a fuzzing run:
      # it must stay fast, and it pins the two crashes fuzzing already found.
      #
      # It is also the only thing that compiles `fuzz/` at all. That crate is outside the
      # workspace, so `cargo test` and `cargo clippy --all-targets` both skip it, and a
      # signature change in the library breaks it without any local command saying so.
      # That has happened twice.
      - name: Replay seeds
        run: |
          for target in socks5_reply socks5_handshake config specs record; do
            echo "--- $target ---"
            for seed in fuzz/seeds/"$target"/*; do
              cargo fuzz run "$target" "$seed"
            done
          done
