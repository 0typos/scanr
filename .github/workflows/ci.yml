# NOTE: written without a remote to run it against, so this file is UNVERIFIED.
# Expect to iterate on it during the first push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures. An unused-variable warning slipped into two commits during
  # development and was only caught by reading build output by hand.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs records the commit into the scan record, so it needs real history
          # rather than a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }}

      - name: Tests
        # Tests bind loopback sockets and spawn in-process SOCKS5 fixtures; no external
        # service is required.
        run: cargo test --target ${{ matrix.target }}

      - name: Static binary is actually static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/scanr
          cargo build --release --target ${{ matrix.target }}
          file "$BIN"
          # The whole point of the musl build is needing nothing at runtime.
          #
          # Tested via NEEDED entries rather than ldd output. ldd prints "statically
          # linked" for a static-pie binary and "not a dynamic executable" for a
          # classic static one, so matching on its text is fragile — an earlier version
          # did exactly that and failed a build that was correctly static.
          needed=$(readelf -d "$BIN" | grep -c NEEDED || true)
          if [ "$needed" -ne 0 ]; then
            readelf -d "$BIN" | grep NEEDED
            echo "::error::musl build links $needed shared librar(ies); it is not static"
            exit 1
          fi
          echo "static: no NEEDED entries"

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with: { key: coverage }
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure
        # Two integration tests deliberately kill a process under a resource limit, which
        # truncates its .profraw and makes llvm-profdata refuse the whole merge. They are
        # covered by the run above in the `check` job; excluding them here costs coverage
        # of code that the in-process failure tests reach anyway.
        run: |
          set -euo pipefail
          cargo llvm-cov --summary-only --json --output-path coverage.json \
            --ignore-filename-regex 'testsupport' -- \
            --skip writer_failure_exits_three --skip resource_pressure_is_reported

      - name: Enforce the floor
        # A floor, not a target. It exists so the failure paths that carried three
        # integrity defects cannot quietly go uncovered again; raise it when the real
        # figure has moved comfortably clear.
        #
        # Note the figure counts inline `#[cfg(test)]` modules, which are themselves
        # fully covered, so it flatters production coverage by a few points. That is
        # fine for a floor — it is measured the same way every run, so a regression
        # still shows — but do not read it as the coverage of shipped code.
        run: |
          set -euo pipefail
          FLOOR=85
          pct=$(jq -r '.data[0].totals.regions.percent' coverage.json)
          printf 'region coverage: %.2f%% (floor %s%%)\n' "$pct" "$FLOOR"
          # An `if` rather than `awk ... && { ... }`: under `set -e` the latter fails the
          # step when awk exits non-zero, which is exactly the passing case.
          if awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p < f) }'; then
            echo "::error::region coverage $pct% is below the $FLOOR% floor"
            exit 1
          fi
          echo "above the floor"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Must match rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with: { key: msrv }
      - run: cargo check --all-targets

  install:
    name: cargo install works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: install }
      # The documented install path. Verified because it was once broken and nobody knew.
      - run: cargo install --path . --root "$RUNNER_TEMP/inst" --locked
      - run: "$RUNNER_TEMP/inst/bin/scanr --version"

  audit:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Replay the fuzz corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { key: fuzz }
      - run: cargo install cargo-fuzz --locked
      # Replay the committed seeds only. This is a regression check, not a fuzzing run:
      # it must stay fast, and it pins the two crashes fuzzing already found.
      - name: Replay seeds
        run: |
          for target in socks5_reply socks5_handshake config specs record; do
            echo "--- $target ---"
            for seed in fuzz/seeds/"$target"/*; do
              cargo fuzz run "$target" "$seed"
            done
          done
