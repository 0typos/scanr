[package]
name = "scanr"
version = "1.0.0-rc.2"
edition = "2024"
description = "Proxy-aware TCP connect scanner with reproducible, durable scan records"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
readme = "README.md"
keywords = ["scanner", "socks5", "proxy", "network", "security"]
categories = ["command-line-utilities", "network-programming"]
authors = ["typo"]
repository = "https://github.com/0typos/scanr"
homepage = "https://github.com/0typos/scanr"

# Distribution is prebuilt static binaries from GitHub releases, not crates.io. This
# guards against an accidental `cargo publish`; remove it if that changes.
publish = false

# Keep the packaged crate to what is needed to build and understand it.
exclude = [
    "/.github",
    "/scanr-results",
    "/fuzz/corpus",
    "/fuzz/artifacts",
]

[lints.rust]
# Every `unsafe` block is an explicit `#[allow(unsafe_code)]` with a SAFETY comment
# stating the obligation it discharges. There are five, all thin libc calls; denying by
# default means a sixth cannot appear without someone writing that comment.
unsafe_code = "deny"

[features]
# In-process SOCKS5 and TCP fixtures. Off by default so a release build carries no
# fixture servers; the dev-dependency below turns it on for the integration tests, which
# are a separate crate and so cannot see `#[cfg(test)]` items.
testsupport = []

[dependencies]
# CLI: subcommand tree, help rendering, shell completions. Hand-rolling this for a
# 15-command tree with completions is real work for no gain. (D18)
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"

# Config: deserialization with byte spans, which drive caret-annotated errors.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# JSONL emission. Correct escaping is not worth hand-rolling.
serde_json = "1"

# SO_LINGER{on,0} (D9). std::net::TcpStream::set_linger is still unstable
# (rust#88494, verified on 1.97.1). M0 measured this as a 7.5x throughput multiplier.
socket2 = "0.6"

# Error definitions only.
thiserror = "2"

# Optional gzip framing for the scan record. `rust_backend` pinned explicitly rather
# than taken by default: the zlib backends are C, and a musl-targeting C toolchain would
# destroy the fully static build that makes the musl target worth having (D19).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# sysctl/rlimit inspection, signal installation, getrandom. No std equivalent.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Man page generation, exercised by a test that fails if man/scanr.1 is stale.
clap_mangen = "0.2"
# Self-dependency so `cargo test` builds the library with the fixtures available while
# `cargo build` and `cargo install` do not.
scanr = { path = ".", features = ["testsupport"] }
# Tests read records written with the default framed-gzip format.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# panic = "unwind" (the default) is deliberate, not an oversight: a panicking worker
# thread must not prevent the writer from finalizing the scan record. Aborting would
# leave a .partial file and destroy the tool's core guarantee. (see docs/design/decisions.md)

[profile.bench]
inherits = "release"

# Faster iteration: optimize dependencies even in debug builds, since the scheduler
# and permutation are unusable at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
